[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-dataset-explorer"
version = "0.1.0"
description = "Local-first interactive explorer for computer-vision image datasets."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.49",
    "opencv-python-headless>=4.9",
    "Pillow>=10.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
]

[project.optional-dependencies]
embeddings = ["torch>=2.2", "timm>=0.9", "scikit-learn>=1.4", "umap-learn>=0.5"]
faiss = ["faiss-cpu>=1.8"]
pdf = ["reportlab>=4.1"]
dev = ["pytest>=8.0"]

[project.scripts]
vision-explorer = "app.launcher:main"

[tool.setuptools]
packages = ["core", "database", "services", "app", "app.pages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
