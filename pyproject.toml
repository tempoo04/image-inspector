[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-dataset-explorer"
version = "0.6.0"
description = "Local-first interactive explorer for computer-vision image datasets."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.49",
    "opencv-python-headless>=4.9",
    "Pillow>=10.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
]

[project.optional-dependencies]
embeddings = ["torch>=2.2", "timm>=0.9", "scikit-learn>=1.4", "umap-learn>=0.5"]
faiss = ["faiss-cpu>=1.8"]
pdf = ["reportlab>=4.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.17.6"]

[project.scripts]
vision-explorer = "app.launcher:main"

[tool.setuptools]
packages = ["core", "database", "services", "app", "app.pages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule selection so lint results do not drift when ruff's built-in
# defaults change between versions. E4/E7/E9/F are ruff's classic defaults;
# E402 enforces imports-at-top; I sorts imports.
select = ["E4", "E7", "E9", "F", "E402", "I"]

[tool.ruff.lint.per-file-ignores]
# main.py prepends the repo root to sys.path before importing local packages,
# so its imports legitimately follow executable code.
"app/main.py" = ["E402"]
