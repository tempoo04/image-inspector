name: Publish Docker image

# Builds the Dockerfile and pushes to GitHub Container Registry (GHCR).
# Triggered by the release-please workflow when a release is cut (same workflow
# run, so GITHUB_TOKEN can trigger it), or manually for a specific tag.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to build and tag the image from.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref/tag to build (e.g. v0.2.0). Blank builds the default branch.
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
